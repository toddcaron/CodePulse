<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodePulse Executive Summary</title>
  <style>
    :root { color-scheme: light; --ink:#19211d; --muted:#5d6962; --paper:#f5f7f2; --surface:#fff; --line:#d9dfd8; --green:#176b4d; --amber:#a65d00; --red:#a52f2f; --blue:#245a7a; }
    * { box-sizing:border-box; } body { margin:0; background:linear-gradient(135deg,#eef4ee 0,var(--paper) 42%,#eef2f6 100%); color:var(--ink); font-family:Georgia,"Times New Roman",serif; line-height:1.55; }
    main { width:min(1120px,calc(100% - 32px)); margin:0 auto; padding:48px 0 72px; } header { border-top:8px solid var(--ink); padding:24px 0 30px; } h1 { max-width:760px; margin:8px 0 12px; font-size:clamp(2.2rem,6vw,4.8rem); line-height:.98; font-weight:500; } h2 { margin:0 0 14px; font:700 1.35rem "Trebuchet MS",Verdana,sans-serif; } .eyebrow,.meta { color:var(--muted); font:700 .8rem "Trebuchet MS",Verdana,sans-serif; text-transform:uppercase; } .lede { max-width:760px; color:var(--muted); font-size:1.12rem; } section,.panel { background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:8px; padding:22px; margin-top:18px; } .dashboard { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; } .metric { border-top:4px solid var(--blue); padding-top:10px; } .metric strong { display:block; font:700 1.1rem "Trebuchet MS",Verdana,sans-serif; } ul { margin:8px 0 0; padding-left:22px; } li { margin:7px 0; } footer { margin-top:30px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:.85rem; } @media(max-width:760px){ main{width:min(100% - 22px,1120px);padding-top:24px}.dashboard{grid-template-columns:repeat(2,1fr)} section,.panel{padding:17px} }
  </style>
</head>
<body>
  <main>
    <header><div class="eyebrow">{assessmentDate} / CodePulse</div><h1>{applicationName}</h1><p class="lede">{executiveSummary}</p></header>
    <section class="dashboard">{dashboardMetrics}</section>
    <section><h2>Top Risks</h2>{topRisks}</section>
    <section><h2>Strengths</h2>{strengths}</section>
    <section><h2>Investment Priorities</h2>{investmentPriorities}</section>
    <footer>{limitations}</footer>
  </main>
</body>
</html>
